[package]
name = "tracker-backend"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "Local HTTP and Calendar backend for Weimo time tracker"
default-run = "tracker-backend"

[dependencies]
async-trait = "0.1.89"
axum = { version = "0.8.8", features = ["json"] }
clap = { version = "4.6.0", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite"] }
thiserror = "2.0.18"
time = { version = "0.3.55", features = ["formatting", "local-offset", "parsing"] }
tokio = { version = "1.50.0", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.22.0", features = ["v4"] }

[dev-dependencies]
http-body-util = "0.1.3"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
